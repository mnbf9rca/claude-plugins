name: Codex manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run generator tests
        run: python3 -m unittest scripts.tests.test_generate_codex_manifests
      - name: Verify Codex manifests are in sync with Claude manifests
        run: python3 scripts/generate_codex_manifests.py --check
